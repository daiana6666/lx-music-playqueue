name: Build Debug APK (No Keystore)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: List APK outputs
        shell: bash
        run: |
          echo "=== debug outputs ==="
          ls -lh android/app/build/outputs/apk/debug/ || true
          echo "=== version ==="
          node -p "require('./package.json').version"

      - name: Get package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-playqueue-universal-debug
          path: android/app/build/outputs/apk/debug/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk
          if-no-files-found: error
